name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow pytest
      - name: 运行测试
        run: python -m pytest tests/ -v

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf pillow pyinstaller
      - name: 打包单文件 exe
        run: pyinstaller PyShelf.spec --noconfirm
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PyShelf-windows
          path: dist/PyShelf.exe
